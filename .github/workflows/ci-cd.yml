name: StrideLux Infrastructure CI

# ─────────────────────────────────────────────────────────────
# Triggers
#   • Every push to main         → security scan + code quality + validate
#   • Every pull_request to main → security scan + code quality + validate
#
# NOTE: terraform apply is intentionally excluded.
# Run terraform plan locally, review the output carefully,
# then apply manually to avoid unintended changes to live infra.
# ─────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── Job 1: Security Scan ───────────────────────────────────
  # Trivy scans Terraform files for misconfigurations.
  # CRITICAL findings with available fixes block the pipeline.
  # ──────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trivy scan — SARIF report
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          scanners: 'misconfig,secret'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true
          skip-dirs: '.terraform'

      - name: Upload results to GitHub Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Trivy scan — CRITICAL gate
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          scanners: 'misconfig,secret'
          severity: 'CRITICAL'
          ignore-unfixed: true
          skip-dirs: '.terraform'
          exit-code: '1'

  # ── Job 2: Code Quality ────────────────────────────────────
  # Static analysis on Terraform source files.
  #
  # SonarCloud is active (free for public repos).
  # SonarQube Community Edition block is ready but dormant —
  # uncomment it and comment out SonarCloud when your
  # self-hosted server is running. Both use SONAR_TOKEN;
  # SonarQube additionally needs SONAR_HOST_URL.
  # ──────────────────────────────────────────────────────────
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── SonarCloud (active) ──────────────────────────────────────────────────
      # Setup: sonarcloud.io → Log in with GitHub → import this repo →
      # copy the generated SONAR_TOKEN to Settings → Secrets → Actions.
      # Update sonar-project.properties with your projectKey and organization.
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # ── SonarQube Community Edition (self-hosted — dormant) ─────────────────
      # Uncomment when your EC2-hosted SonarQube server is running.
      # Add SONAR_HOST_URL (e.g. http://your-ec2-ip:9000) to repo secrets.
      # SONAR_TOKEN value comes from SonarQube server, not SonarCloud.
      # Comment out the SonarCloud step above before enabling this.
      #
      # - name: SonarQube Scan
      #   uses: SonarSource/sonarqube-scan-action@master
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ── Job 3: Terraform Validate ─────────────────────────────
  # Checks syntax and internal consistency of .tf files.
  # Safe: no AWS API calls, no state access, no changes made.
  # ──────────────────────────────────────────────────────────
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs: [security-scan]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init (no backend — syntax check only)
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform Format Check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform -chdir=terraform validate

      - name: Write validation summary
        if: always()
        run: |
          echo "### Terraform validation ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Time** | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
