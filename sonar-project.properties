# ─────────────────────────────────────────────────────────────
# SonarCloud / SonarQube project configuration
#
# To activate: sonarcloud.io → Log in with GitHub → import this
# repo → copy the projectKey and organization values shown and
# paste them below, then add SONAR_TOKEN to repo secrets.
# ─────────────────────────────────────────────────────────────

# Update these two values from sonarcloud.io after importing the repo
sonar.projectKey=Joesmithessang_stridelux-infra
sonar.organization=joeyvulnapp

sonar.projectName=StrideLux Infrastructure
sonar.projectVersion=1.0

# Analyse Terraform source only — exclude provider cache
sonar.sources=terraform
sonar.exclusions=**/.terraform/**,**/plan.txt,**/plan_output.txt

# AWS provider version — removes the provider version warning in SonarCloud
sonar.terraform.provider.aws.version=5.100.0

# Explicit encoding to avoid file encoding warnings (Windows CRLF files)
sonar.sourceEncoding=UTF-8
